<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audiologi eksamensøving</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topp">
    <button id="hjem-knapp" class="lenkeknapp" hidden>← Hjem</button>
    <h1>Audiologi eksamensøving</h1>
    <button id="meny-knapp" class="menyknapp" aria-label="Meny" aria-expanded="false" hidden>☰</button>
  </header>

  <!-- Menyen bak de tre strekene. Innholdet tegnes av app.js når den åpnes. -->
  <nav id="meny" class="meny" hidden></nav>

  <!-- Alt innhold tegnes inn her av app.js -->
  <main id="app"></main>

  <!-- Supabase-biblioteket (innlogging og database). Laster det ikke (uten nett), virker appen lokalt. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>

  <!-- Hver eksamen har egne filer. De som heter «-noe» legger til i listene fra filene over seg. -->
  <script src="data/oppgaver.js"></script>
  <script src="data/oppgaver-host2024.js"></script>
  <script src="data/oppgaver-host2024-offisiell.js"></script>
  <script src="data/aut1000-h25-oppgaver.js"></script>
  <script src="data/aut1000-h23-oppgaver.js"></script>
  <script src="data/kort.js"></script>
  <script src="data/kort-host2024.js"></script>
  <script src="data/kort-host2024-offisiell.js"></script>
  <script src="data/aut1000-kort.js"></script>

  <script src="sky.js"></script>
  <script src="app.js"></script>
</body>
</html>
